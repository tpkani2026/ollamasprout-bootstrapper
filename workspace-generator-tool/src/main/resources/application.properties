spring.application.name=workspace-generator-tool
# \uD83D\uDE80 CHANGED TO 8081 TO PREVENT BINDING COLLISIONS WITH GENERATED SERVICES
server.port=8081

# ==========================================
# Google Gemini Configuration Setup
# ==========================================
# Securely maps your system environment variable at runtime bootstrap
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Explicitly overrides the deprecated default and routes requests to Gemini 3.8 Flash
spring.ai.google.genai.chat.options.model=gemini-3.8-flash
